[package]
name = "repro_atlas_lifetime"
version = "0.0.1"
edition = "2021"
description = "Host-only, headless-GPU reproduction of ../PLAN.md §7.6's rendering bug (an unrelated glyph vanishes once a TextField-triggered resize occurs). Proves the root cause directly: gpu_harness::render_thread::reconfigure() rebuilds vello_hybrid::Renderer (and therefore its GPU atlas texture) on every resize but never rebuilds the vello_hybrid::Resources glyph-atlas *cache* alongside it — violating that crate's own documented \"create one [Resources] instance per renderer\" contract. See src/main.rs for the full account and the fix this crate verifies."

[dependencies]
zkite_renderer = { path = "../renderer" }
vello_hybrid = { version = "0.1", default-features = false, features = ["wgpu", "wgpu_default", "text"] }
glifo = "0.2"
peniko = "0.6"
kurbo = "0.13"
wgpu = { version = "29", default-features = false, features = ["std", "wgsl", "vulkan"] }
pollster = "0.4"
