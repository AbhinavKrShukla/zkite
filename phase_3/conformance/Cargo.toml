[package]
name = "conformance"
version = "0.0.1"
edition = "2021"
description = "Phase 3 §5 item 5 — per-widget conformance testing against the WebView backend. Two subcommands: `render` (a fixture's native `to_tree()` JSON -> zkite_renderer + vello_cpu -> PNG, the same pipeline spike1_render_pipeline uses) and `diff` (two same-size PNGs -> a tolerance-based pixel-mismatch report + a visual diff PNG). See ../PLAN.md §5."
license = "Apache-2.0"

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
zkite_renderer = { path = "../renderer" }
zkite_pybridge = { path = "../pybridge" }
# The *same* decoder the device runs (../PLAN.md §35.4) — sharing it is what makes an
# image fixture's diff measure ZKite against Chromium rather than one decoder against
# another.
zkite_imagestore = { path = "../imagestore" }
vello_cpu = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
